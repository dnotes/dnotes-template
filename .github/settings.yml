repository:
  # See https://docs.github.com/en/rest/repos/repos#update-a-repository for all available settings.
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false
  default_branch: main
  # Squash merging only: every merge adds exactly one commit to main. Hosting
  # services that deploy sites/* based on changed files (see "Deploying sites"
  # in the README) rebuild everything when a push has 20+ commits.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "test"
      enforce_admins: false  # Allows admins to bypass restrictions
      restrictions: null  # Anyone with write access can create branches
      allow_force_pushes: false
      allow_deletions: false