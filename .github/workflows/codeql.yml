# CodeQL security scan
#
# What it does, in plain terms:
#   Reads the code (without running it) looking for common security mistakes,
#   such as untrusted input reaching a shell command or a web page, and unsafe
#   patterns in these workflow files. Findings appear in the repository's
#   Security tab and as comments on pull requests.
#
# When it runs:
#   On every pull request, on every change to main, and once a week (to pick
#   up newly added checks even when the code hasn't changed). It doesn't run
#   in the template repository itself (dnotes/dnotes-template).
#
# Note: don't also turn on CodeQL "default setup" in the repository settings;
# GitHub allows only one of the two.

name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '27 4 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # The template repository has no JavaScript, and CodeQL fails when asked
    # to scan a language it can't find.
    if: github.repository != 'dnotes/dnotes-template'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload CodeQL results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
