# CI & Release
#
# What it does, in plain terms:
#
#   On every pull request:
#     - Builds the project and runs all the tests ("test"). A pull request
#       can't be merged into main until this passes.
#
#   On every change to main (a merged pull request):
#     - Runs the tests again. Nothing below happens unless they pass.
#     - Releases, using Changesets:
#         * If there are unreleased change notes (files in .changeset/), it opens
#           or updates a "release" pull request that bumps version numbers and
#           updates the changelogs. Nothing is published yet.
#         * When that release pull request is merged, it publishes the new
#           package versions to npm (after you approve it, if the npm-publish
#           environment has required reviewers).
#
#   When started by hand from the Actions tab ("Run workflow"):
#     - Runs only the tests, on the branch you pick. Nothing is released.
#
#   Sites in sites/ are not deployed from here; see "Deploying sites" in the
#   README.
#
# Security notes for maintainers:
# - Every job starts with no permissions and asks only for what it needs.
# - Publishing uses npm trusted publishing (OIDC), so there is no npm token.
#   Only the "publish" job can get npm credentials, and it never runs build or
#   dependency scripts; packages are built and packed in the "pack" job.
#   Based on https://changesets.dev/guide/automating#trusted-publishing
# - Actions are pinned to full commit SHAs; Dependabot keeps them updated.

name: CI & Release

on:
  pull_request:
  push:
    branches:
      - main
  # Lets you run the tests by hand from the Actions tab (used for release PRs).
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated PR runs, but never interrupt a release in progress on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name "test" is a required status check in .github/settings.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Runs only if the root package.json has a "playwright-install-ci" script
      # (e.g. "playwright install --with-deps"); otherwise does nothing.
      - name: Install Playwright browsers
        run: pnpm -w run --if-present playwright-install-ci

      - name: Run tests
        run: pnpm -w run test

  # The release jobs below don't use the dependency cache, so a poisoned cache
  # can't affect what gets published.

  # Decides what to do: "version" (open/update the release PR), "publish"
  # (publish new versions to npm), or "none".
  select-mode:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Opens or updates the release PR.
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit version changes
      pull-requests: write # open the release PR
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore: new release"
          pr-title: "chore: new release candidate"

  # Builds the packages and packs them into tarballs for the publish job.
  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Publishes the packed tarballs to npm and creates GitHub releases.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Give this environment required reviewers so every publish needs approval.
    environment: npm-publish
    permissions:
      contents: write # create GitHub releases and tags
      id-token: write # npm trusted publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # No dependency scripts run in the job that holds publish credentials.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
